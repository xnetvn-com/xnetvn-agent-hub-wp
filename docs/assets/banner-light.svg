  <text x="96" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0b1b2b">xNetVN Agent Hub WP</text>
  <text x="96" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#33475b">A capability-scoped MCP server that keeps AI agents</text>
  <text x="96" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#33475b">within the permissions of the user who issued the key.</text>
