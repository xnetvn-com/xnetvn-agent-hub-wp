  <text x="140" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">xN</text>
  <text x="96" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0b1b2b">xNetVN Agent Hub WP</text>
