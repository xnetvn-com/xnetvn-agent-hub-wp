<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">xNetVN Agent Hub WP</title>
  <desc id="desc">Capability-scoped MCP server for WordPress</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2271b1"/>
      <stop offset="1" stop-color="#135e96"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g fill="none" stroke="#c3d2e6" stroke-width="2">
    <path d="M120 470 L320 380 L520 470 L720 380 L920 470 L1120 380"/>
    <path d="M320 380 L520 290 L720 380 L920 290 L1120 200"/>
  </g>
  <g fill="#2271b1">
    <circle cx="120" cy="470" r="9"/><circle cx="320" cy="380" r="9"/><circle cx="520" cy="470" r="9"/>
    <circle cx="720" cy="380" r="9"/><circle cx="920" cy="470" r="9"/><circle cx="1120" cy="380" r="9"/>
    <circle cx="520" cy="290" r="9"/><circle cx="920" cy="290" r="9"/><circle cx="1120" cy="200" r="9"/>
  </g>
  <g>
