<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500" role="img" aria-labelledby="title">
	<title id="title">xNetVN Agent Hub WP: MCP tools bounded by WordPress permissions</title>
