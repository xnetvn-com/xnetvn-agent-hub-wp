	<rect width="1544" height="500" fill="#0f1b2d"/>
	<g id="logo" transform="translate(96 96)">
		<rect width="96" height="96" rx="22" fill="#1f6fc9"/>
		<g transform="translate(16 26)">
			<circle cx="15" cy="15" r="12" fill="none" stroke="#ffffff" stroke-width="7"/>
			<rect x="30" y="11" width="40" height="8" fill="#ffffff"/>
			<rect x="52" y="19" width="8" height="15" fill="#ffffff"/>
			<rect x="64" y="19" width="8" height="11" fill="#ffffff"/>
		</g>
	</g>
	<g id="illustration" transform="translate(904 64)">
		<rect width="544" height="372" rx="28" fill="#16263d" stroke="#2f86e0" stroke-opacity="0.45" stroke-width="2"/>
		<rect x="56" y="52" width="432" height="268" rx="22" fill="none" stroke="#2f86e0" stroke-opacity="0.55" stroke-width="2"/>
		<rect x="110" y="98" width="324" height="176" rx="16" fill="none" stroke="#6fb0f2" stroke-opacity="0.75" stroke-width="2"/>
		<rect x="168" y="146" width="208" height="80" rx="12" fill="#2f86e0" fill-opacity="0.18" stroke="#8fc4ff" stroke-width="2"/>
		<g transform="translate(230 168)">
			<circle cx="18" cy="18" r="13" fill="none" stroke="#e6f1ff" stroke-width="6"/>
			<rect x="32" y="15" width="52" height="6" fill="#e6f1ff"/>
			<rect x="58" y="21" width="6" height="13" fill="#e6f1ff"/>
			<rect x="72" y="21" width="6" height="9" fill="#e6f1ff"/>
		</g>
	</g>
	<text x="96" y="278" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#ffffff">xNetVN Agent Hub WP</text>
	<text x="96" y="344" font-family="DejaVu Sans" font-size="34" fill="#c7d4e6">MCP tools bounded by WordPress permissions</text>
</svg>
