name: Security scan

# Secret detection, static analysis and filesystem advisories. Pull requests scan
# every commit in the pull-request range and the final merge tree; pushes scan
# only the pushed range; the weekly run scans the complete history. This keeps
# the expensive full-history scan off every pull request without reducing the
# periodic coverage.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      self_hosted_trial:
        description: "Run once on self-hosted runners (trial)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Secret detection (Gitleaks)
    # The pinned Gitleaks archive is linux_x64 only, so this job declares the
    # architecture instead of accepting any Linux runner.
    runs-on: ${{ fromJSON(((inputs.self_hosted_trial) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.XNETVN_CI_RUNNER == 'true')) && '["self-hosted","linux","x64"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the trusted Gitleaks policy
        id: policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash bin/prepare-gitleaks-policy.sh "$BASE_SHA"
      - name: Install verified Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict -
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Scan for leaked secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          CONFIG: ${{ steps.policy.outputs.config }}
        run: |
          set -euo pipefail
          status=0
          config_args=()
          if [ -n "${CONFIG:-}" ]; then
            config_args=(--config "$CONFIG")
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Scan every commit between the base and the merge revision so a
            # secret that was added and then removed is still reported.
            if [ -n "$BASE_SHA" ] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && \
              git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              gitleaks git "${config_args[@]}" --no-banner --redact --report-format sarif \
                --report-path gitleaks-history.sarif \
                --log-opts="${BASE_SHA}..${HEAD_SHA} -m" . || status=$?
            else
              # The base object is unavailable. Never fail open to a tree-only
              # scan: scan every fetched commit so an add-then-remove secret is
              # still reported.
              echo "::warning title=History scan fallback::The pull-request base revision is unavailable; scanning all fetched history instead."
              gitleaks git "${config_args[@]}" --no-banner --redact --report-format sarif \
                --report-path gitleaks-history.sarif --log-opts="--all -m" . || status=$?
            fi
            # Scan the final merge tree as well, so the merge result itself is
            # covered even if a merge diff is empty.
            gitleaks dir "${config_args[@]}" --no-banner --redact --report-format sarif \
              --report-path gitleaks-working-tree.sarif . || status=$?
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            gitleaks git "${config_args[@]}" --no-banner --redact --report-format sarif \
              --report-path gitleaks-history.sarif \
              --log-opts="${BEFORE_SHA}..${HEAD_SHA} -m" . || status=$?
          else
            gitleaks git "${config_args[@]}" --no-banner --redact --report-format sarif \
              --report-path gitleaks-history.sarif --log-opts="--all -m" . || status=$?
          fi
          exit "$status"
      - name: Upload Gitleaks SARIF artifacts
        if: always() && hashFiles('gitleaks-*.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitleaks-sarif
          path: gitleaks-*.sarif
          if-no-files-found: warn
          retention-days: 14

  sast:
    name: Static analysis (Semgrep)
    runs-on: ${{ fromJSON(((inputs.self_hosted_trial) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.XNETVN_CI_RUNNER == 'true')) && '["self-hosted","linux"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Cache the pinned scanner download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.environment }}-${{ runner.os }}-py3.12-semgrep-1.179.0
      - name: Install Semgrep in an isolated environment
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/semgrep-venv"
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install \
            --disable-pip-version-check semgrep==1.179.0
          printf '%s\n' "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
      - name: Scan PHP sources
        run: semgrep scan --config p/php --severity ERROR --error --metrics=off --disable-version-check --sarif --output semgrep.sarif .
      - name: Upload Semgrep SARIF artifact
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

  filesystem:
    name: Filesystem vulnerability scan (Trivy)
    runs-on: ${{ fromJSON(((inputs.self_hosted_trial) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.XNETVN_CI_RUNNER == 'true')) && '["self-hosted","linux"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan repository files
        env:
          # The action defaults to mirror.gcr.io, which returned 404 for the
          # database layer on 2026-11-03. GHCR is the canonical Trivy database.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.75.0
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-sarif
          path: trivy.sarif
          retention-days: 14
